<svg width="1200" height="380" viewBox="0 0 1200 380" xmlns="http://www.w3.org/2000/svg">
<defs>
  <!-- Background Gradient -->
  <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0%" stop-color="#04070c"/>
    <stop offset="45%" stop-color="#0a121c"/>
    <stop offset="85%" stop-color="#0e1b27"/>
    <stop offset="100%" stop-color="#07131d"/>
  </linearGradient>

  <!-- Cyan/Teal Moving Ray Gradient (Sushmita Style) -->
  <linearGradient id="bannerRay" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0%" stop-color="#ffffff"/>
    <stop offset="35%" stop-color="#5eead4"/>
    <stop offset="70%" stop-color="#2dd4bf"/>
    <stop offset="100%" stop-color="#0f766e" stop-opacity="0"/>
  </linearGradient>

  <!-- Sheen on Main Name (Sushmita Style) -->
  <linearGradient id="titleSheen" x1="-300" y1="0" x2="0" y2="0" gradientUnits="userSpaceOnUse">
    <stop offset="0%" stop-color="#ffffff"/>
    <stop offset="50%" stop-color="#5eead4"/>
    <stop offset="100%" stop-color="#ffffff"/>
    <animateTransform attributeName="gradientTransform" type="translate" values="0 0; 1500 0; 1500 0" keyTimes="0; .45; 1" dur="7s" begin="1s" repeatCount="indefinite"/>
  </linearGradient>

  <!-- Node Glow -->
  <filter id="nodeGlow" x="-50%" y="-50%" width="200%" height="200%">
    <feGaussianBlur stdDeviation="4" result="blur"/>
    <feMerge>
      <feMergeNode in="blur"/>
      <feMergeNode in="SourceGraphic"/>
    </feMerge>
  </filter>

  <!-- Energy Pulse Glow -->
  <filter id="signalGlow" x="-100%" y="-100%" width="300%" height="300%">
    <feGaussianBlur stdDeviation="6" result="blur1"/>
    <feGaussianBlur stdDeviation="3" result="blur2"/>
    <feMerge>
      <feMergeNode in="blur1"/>
      <feMergeNode in="blur2"/>
      <feMergeNode in="SourceGraphic"/>
    </feMerge>
  </filter>

  <!-- Tech Grid Overlay -->
  <pattern id="grid" width="36" height="36" patternUnits="userSpaceOnUse">
    <path d="M 36 0 L 0 0 0 36" fill="none" stroke="#132433" stroke-width="0.9" opacity="0.45"/>
    <circle cx="36" cy="36" r="0.8" fill="#1e3a52" opacity="0.6"/>
  </pattern>

  <!-- Scanning Laser Gradient -->
  <linearGradient id="laserScan" x1="0" y1="0" x2="1" y2="0">
    <stop offset="0%" stop-color="#2dd4bf" stop-opacity="0"/>
    <stop offset="50%" stop-color="#2dd4bf" stop-opacity="0.85"/>
    <stop offset="100%" stop-color="#2dd4bf" stop-opacity="0"/>
  </linearGradient>

  <!-- Circuit Line Gradient -->
  <linearGradient id="circuitGrad" x1="0" y1="0" x2="1" y2="0">
    <stop offset="0%" stop-color="#143447"/>
    <stop offset="50%" stop-color="#2dd4bf" stop-opacity="0.8"/>
    <stop offset="100%" stop-color="#143447"/>
  </linearGradient>

  <clipPath id="innerScreen">
    <rect x="36" y="24" width="1128" height="332" rx="18"/>
  </clipPath>
</defs>

<style>
  .s-serif { font-family: Georgia, "Iowan Old Style", "Palatino Linotype", "Times New Roman", serif; }
  .s-mono { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, "Liberation Mono", monospace; }
  .s-sans { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }
</style>

<!-- Outer Canvas -->
<rect width="1200" height="380" fill="#020408"/>

<!-- Main Terminal Window Frame -->
<rect x="36" y="24" width="1128" height="332" rx="18" fill="url(#bg)" stroke="#1a2e3d" stroke-width="1.6"/>
<rect x="36" y="24" width="1128" height="332" rx="18" fill="url(#grid)" clip-path="url(#innerScreen)"/>

<!-- ================= SUSHMITA-STYLE MOVING RAY ON BORDER ================= -->
<!-- Perimeter = 2 * (1128 + 332) = 2920 -->
<rect x="36" y="24" width="1128" height="332" rx="18" fill="none" 
      stroke="url(#bannerRay)" stroke-width="2.4" stroke-linecap="round"
      stroke-dasharray="480 2440">
  <animate attributeName="stroke-dashoffset" values="2920;0" dur="6.5s" repeatCount="indefinite"/>
</rect>

<!-- ================= TOP CONTROLS & HEADER ================= -->
<circle cx="68" cy="54" r="6" fill="#ff5f56"/>
<circle cx="90" cy="54" r="6" fill="#ffbd2e"/>
<circle cx="112" cy="54" r="6" fill="#27c93f"/>

<text class="s-mono" x="144" y="58" fill="#5eead4" font-size="12" font-weight="600" letter-spacing="1.8">
  ARYAN.DEV // PW INSTITUTE OF INNOVATION // B.TECH CSE
</text>

<g transform="translate(995, 46)">
  <!-- Pulsating Live Dot -->
  <circle cx="0" cy="8" r="4.5" fill="#2dd4bf">
    <animate attributeName="r" values="4;6.5;4" dur="2s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="1;0.4;1" dur="2s" repeatCount="indefinite"/>
  </circle>
  <text class="s-mono" x="15" y="12" fill="#2dd4bf" font-size="11.5" font-weight="700" letter-spacing="1.2">
    STREAK: 300D+ 🔥
  </text>
</g>

<!-- Top Separator -->
<line x1="36" y1="76" x2="1164" y2="76" stroke="#162736" stroke-width="1.2"/>

<!-- ================= LEFT IDENTITY COLUMN ================= -->
<rect x="72" y="100" width="146" height="22" rx="4" fill="#0d2b2c" stroke="#14b8a6" stroke-width="0.8"/>
<text class="s-mono" x="82" y="115" fill="#2dd4bf" font-size="10.5" font-weight="700" letter-spacing="1.5">
  01 // SOFTWARE &amp; DSA
</text>

<!-- Main Name Heading with Editorial Serif & Italic Sheen (Sushmita Style) -->
<text class="s-serif" x="70" y="166" font-size="48" font-weight="300" letter-spacing="-1" fill="#f0f6fc">
  Aryan <tspan font-style="italic" fill="url(#titleSheen)">Gupta.</tspan>
</text>

<!-- Subtitle / Passion -->
<text class="s-mono" x="72" y="194" fill="#5eead4" font-size="13" letter-spacing="1">
  algorithms · systems engineering · backend development
</text>

<!-- Blinking Cursor -->
<rect x="530" y="181" width="8" height="15" fill="#2dd4bf">
  <animate attributeName="opacity" values="1;0;1" dur="0.9s" repeatCount="indefinite"/>
</rect>

<!-- Education & Status line -->
<text class="s-sans" x="72" y="224" fill="#8ca0b3" font-size="13">
  <tspan fill="#38bdf8" font-weight="600">Education:</tspan> B.Tech in Computer Science · Semester 3
  <tspan fill="#64748b">  |  </tspan>
  <tspan fill="#2dd4bf" font-weight="600">PW Institute of Innovation</tspan>
</text>

<!-- ================= RIGHT SIDE: TECH CIRCUIT DIAGRAM ================= -->
<text class="s-mono" x="710" y="106" fill="#5eead4" font-size="11" font-weight="700" letter-spacing="2">
  // ARCHITECTURE &amp; SYSTEMS
</text>

<!-- Circuit Traces -->
<path d="M 710 165 L 760 165 L 790 135 L 860 135 L 890 170 L 970 170 L 1000 135 L 1080 135" 
      fill="none" stroke="url(#circuitGrad)" stroke-width="2.8" stroke-linecap="round" stroke-linejoin="round"/>

<path d="M 790 135 L 790 205 L 850 205 L 890 170" 
      fill="none" stroke="#143447" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>

<path d="M 970 170 L 970 205 L 1030 205 L 1060 175" 
      fill="none" stroke="#143447" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>

<!-- Node 1: Java (Primary) -->
<circle cx="710" cy="165" r="7.5" fill="#f59e0b" filter="url(#nodeGlow)"/>
<circle cx="710" cy="165" r="3" fill="#ffffff"/>
<text class="s-mono" x="710" y="190" fill="#fbd38d" font-size="12" font-weight="700" text-anchor="middle">Java</text>
<text class="s-mono" x="710" y="203" fill="#64748b" font-size="9.5" text-anchor="middle">JDBC/JPA</text>

<!-- Node 2: C++ (CP/DSA) -->
<circle cx="860" cy="135" r="7.5" fill="#06b6d4" filter="url(#nodeGlow)"/>
<circle cx="860" cy="135" r="3" fill="#ffffff"/>
<text class="s-mono" x="860" y="118" fill="#67e8f9" font-size="12" font-weight="700" text-anchor="middle">C++</text>
<text class="s-mono" x="860" y="105" fill="#64748b" font-size="9.5" text-anchor="middle">DSA / CP</text>

<!-- Node 3: Python -->
<circle cx="850" cy="205" r="6" fill="#3b82f6" filter="url(#nodeGlow)"/>
<text class="s-mono" x="850" y="225" fill="#93c5fd" font-size="11" font-weight="600" text-anchor="middle">Python</text>

<!-- Node 4: SQL & Database -->
<circle cx="970" cy="170" r="7" fill="#10b981" filter="url(#nodeGlow)"/>
<circle cx="970" cy="170" r="2.5" fill="#ffffff"/>
<text class="s-mono" x="970" y="152" fill="#6ee7b7" font-size="12" font-weight="700" text-anchor="middle">SQL</text>
<text class="s-mono" x="970" y="140" fill="#64748b" font-size="9.5" text-anchor="middle">MySQL</text>

<!-- Node 5: JavaScript / Web -->
<circle cx="1030" cy="205" r="6" fill="#facc15" filter="url(#nodeGlow)"/>
<text class="s-mono" x="1030" y="225" fill="#fde047" font-size="11" font-weight="600" text-anchor="middle">JS/Web</text>

<!-- Node 6: Docker / Git -->
<circle cx="1080" cy="135" r="7" fill="#38bdf8" filter="url(#nodeGlow)"/>
<circle cx="1080" cy="135" r="2.5" fill="#ffffff"/>
<text class="s-mono" x="1080" y="118" fill="#7dd3fc" font-size="12" font-weight="700" text-anchor="middle">Docker</text>
<text class="s-mono" x="1080" y="105" fill="#64748b" font-size="9.5" text-anchor="middle">Git/Maven</text>

<!-- Traveling Energy Signal across the circuit -->
<circle r="5" fill="#ffffff" filter="url(#signalGlow)">
  <animateMotion dur="5s" repeatCount="indefinite"
    path="M 710 165 L 760 165 L 790 135 L 860 135 L 890 170 L 970 170 L 1000 135 L 1080 135"/>
</circle>

<!-- ================= LOWER METRICS ROW ================= -->
<line x1="72" y1="250" x2="1128" y2="250" stroke="#162736" stroke-width="1.2"/>

<!-- Metric 1: Problems Solved -->
<g transform="translate(72, 266)">
  <rect width="230" height="60" rx="10" fill="#091824" stroke="#16384c" stroke-width="1"/>
  <text class="s-mono" x="16" y="24" fill="#64748b" font-size="10.5" font-weight="600" letter-spacing="1">TOTAL SOLVED</text>
  <text class="s-serif" x="16" y="50" fill="#2dd4bf" font-size="24" font-weight="700">800+ Unique</text>
  <text class="s-mono" x="165" y="48" fill="#64748b" font-size="10.5">Problems</text>
</g>

<!-- Metric 2: LeetCode Rating & Streak -->
<g transform="translate(322, 266)">
  <rect width="250" height="60" rx="10" fill="#091824" stroke="#16384c" stroke-width="1"/>
  <text class="s-mono" x="16" y="24" fill="#64748b" font-size="10.5" font-weight="600" letter-spacing="1">LEETCODE CONTEST</text>
  <text class="s-serif" x="16" y="50" fill="#f59e0b" font-size="24" font-weight="700">1592 Peak</text>
  <text class="s-mono" x="145" y="48" fill="#2dd4bf" font-size="11" font-weight="700">· 300d+ Streak</text>
</g>

<!-- Metric 3: ICPC & CodeChef -->
<g transform="translate(592, 266)">
  <rect width="260" height="60" rx="10" fill="#091824" stroke="#16384c" stroke-width="1"/>
  <text class="s-mono" x="16" y="24" fill="#64748b" font-size="10.5" font-weight="600" letter-spacing="1">CONTEST HONORS</text>
  <text class="s-serif" x="16" y="50" fill="#38bdf8" font-size="22" font-weight="700">ICPC Prelim '26</text>
  <text class="s-mono" x="180" y="48" fill="#93c5fd" font-size="11">Rank 1168</text>
</g>

<!-- Metric 4: Philosophy Quote (CodeDNA) -->
<g transform="translate(872, 266)">
  <rect width="256" height="60" rx="10" fill="#091824" stroke="#16384c" stroke-width="1"/>
  <text class="s-mono" x="16" y="24" fill="#64748b" font-size="10.5" font-weight="600" letter-spacing="1">PROJECT CODEDNA</text>
  <text class="s-serif" x="16" y="44" fill="#cbd5e1" font-size="12" font-style="italic">"Get hired for what you build,</text>
  <text class="s-serif" x="16" y="56" fill="#2dd4bf" font-size="12" font-style="italic">not where you study."</text>
</g>

<!-- ================= ANIMATED LASER SCANLINE ================= -->
<rect x="36" y="24" width="4" height="332" fill="url(#laserScan)" opacity="0.4" clip-path="url(#innerScreen)">
  <animate attributeName="x" values="36;1160;36" dur="7s" repeatCount="indefinite"/>
</rect>

</svg>