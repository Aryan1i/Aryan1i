<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 110" width="1200" height="110" role="img">
  <defs>
    <!-- Line gradient with glowing cyan/teal -->
    <linearGradient id="line-04" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#2dd4bf"/>
      <stop offset="50%" stop-color="#14b8a6"/>
      <stop offset="100%" stop-color="#04070c" stop-opacity="0"/>
    </linearGradient>

    <!-- Traveling Sheen on Title Text -->
    <linearGradient id="sheen-04" x1="-200" y1="0" x2="0" y2="0" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#f0f6fc"/>
      <stop offset="50%" stop-color="#5eead4"/>
      <stop offset="100%" stop-color="#f0f6fc"/>
      <animateTransform attributeName="gradientTransform" type="translate" values="0 0; 1400 0; 1400 0" keyTimes="0; .45; 1" dur="6.5s" repeatCount="indefinite"/>
    </linearGradient>

    <!-- Glowing Traveling Pulse Dot -->
    <radialGradient id="pulse-04">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="40%" stop-color="#5eead4" stop-opacity="0.9"/>
      <stop offset="80%" stop-color="#2dd4bf" stop-opacity="0.5"/>
      <stop offset="100%" stop-color="#0f766e" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- Number &amp; Category Tag -->
  <g font-family="'JetBrains Mono', ui-monospace, Menlo, Consolas, monospace">
    <text x="40" y="32" font-size="12" font-weight="700" letter-spacing="3" fill="#2dd4bf">
      <tspan fill="#5eead4">04</tspan>   //   CONTRIBUTION JOURNEY
    </text>
    <text x="1160" y="32" text-anchor="end" font-size="11" font-weight="600" letter-spacing="2" fill="#64748b">
      YEAR OF PERSISTENCE
    </text>
  </g>

  <!-- Main Section Title -->
  <text x="38" y="76" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" 
        font-size="34" font-weight="700" letter-spacing="-0.5" fill="url(#sheen-04)">
    Public Commit Timeline
  </text>

  <!-- Divider Line -->
  <path d="M40 98 H1160" stroke="url(#line-04)" stroke-width="1.4"/>

  <!-- Traveling Pulse Light Ray Particle -->
  <circle cx="40" cy="98" r="6" fill="url(#pulse-04)">
    <animate attributeName="cx" values="40;1160" dur="5.5s" repeatCount="indefinite" calcMode="spline" keyTimes="0;1" keySplines=".4 0 .6 1"/>
    <animate attributeName="opacity" values="0;1;1;0" keyTimes="0;.1;.85;1" dur="5.5s" repeatCount="indefinite"/>
  </circle>
</svg>