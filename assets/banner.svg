<!-- Metric 3: ICPC & CodeChef -->
<g transform="translate(592, 266)">
  <rect width="260" height="60" rx="10" fill="#091824" stroke="#16384c" stroke-width="1"/>
  <text x="16" y="25" fill="#64748b" font-family="'JetBrains Mono', monospace" font-size="10.5" font-weight="600" letter-spacing="1">CONTEST HONORS</text>
  <text x="16" y="49" fill="#38bdf8" font-family="'Segoe UI', monospace" font-size="20" font-weight="800">ICPC Prelim '26</text>
  <text x="180" y="47" fill="#93c5fd" font-family="'JetBrains Mono', monospace" font-size="11">Rank 1168</text>
</g>

<!-- Metric 4: Philosophy Quote (CodeDNA) -->
<g transform="translate(872, 266)">
  <rect width="256" height="60" rx="10" fill="#091824" stroke="#16384c" stroke-width="1"/>
  <text x="16" y="25" fill="#64748b" font-family="'JetBrains Mono', monospace" font-size="10" font-weight="600" letter-spacing="1">PROJECT CODEDNA</text>
  <text x="16" y="44" fill="#cbd5e1" font-family="'Segoe UI', sans-serif" font-size="11.5" font-style="italic">"Get hired for what you build,</text>
  <text x="16" y="56" fill="#2dd4bf" font-family="'Segoe UI', sans-serif" font-size="11.5" font-style="italic">not where you study."</text>
</g>

<!-- ================= ANIMATED LASER SCANLINE ================= -->
<rect x="36" y="24" width="4" height="332" fill="url(#laserScan)" opacity="0.4" clip-path="url(#innerScreen)">
  <animate attributeName="x" values="36;1160;36" dur="7s" repeatCount="indefinite"/>
</rect>

</svg>
