<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 520" width="1200" height="520" role="img">
  <defs>
    <linearGradient id="prj-bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#04070c"/>
      <stop offset="60%" stop-color="#0a121c"/>
      <stop offset="100%" stop-color="#07131d"/>
    </linearGradient>

    <radialGradient id="prj-glow" cx="50%" cy="50%" r="65%">
      <stop offset="0%" stop-color="#14b8a6" stop-opacity=".18"/>
      <stop offset="100%" stop-color="#04070c" stop-opacity="0"/>
    </radialGradient>

    <!-- Sushmita-Style Moving Border Ray (Perimeter = 2 * (1200 + 520) = 3440) -->
    <linearGradient id="prjRay" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="35%" stop-color="#5eead4"/>
      <stop offset="70%" stop-color="#2dd4bf"/>
      <stop offset="100%" stop-color="#0f766e" stop-opacity="0"/>
    </linearGradient>

    <filter id="pillGlow">
      <feGaussianBlur stdDeviation="2" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <style>
    .ps-serif { font-family: Georgia, "Iowan Old Style", "Palatino Linotype", "Times New Roman", serif; }
    .ps-mono { font-family: ui-monospace, SFMono-Regular, "JetBrains Mono", Menlo, Consolas, monospace; }
    .ps-sans { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }
    .ps-card { transition: all .3s ease; }
  </style>

  <!-- Outer Card Frame -->
  <rect width="1200" height="520" rx="18" fill="url(#prj-bg)"/>
  <rect width="1200" height="520" rx="18" fill="url(#prj-glow)"/>
  <rect x=".5" y=".5" width="1199" height="519" rx="17.5" fill="none" stroke="#1a2e3d" stroke-width="1.2"/>

  <!-- MOVING RAY ON OUTER BORDER -->
  <rect x=".5" y=".5" width="1199" height="519" rx="17.5" fill="none" 
        stroke="url(#prjRay)" stroke-width="2.2" stroke-linecap="round"
        stroke-dasharray="480 2960">
    <animate attributeName="stroke-dashoffset" values="3440;0" dur="7s" repeatCount="indefinite"/>
  </rect>

  <!-- ================= CARD 1: PROJECT CODEDNA ================= -->
  <g class="ps-card" transform="translate(40, 36)">
    <rect width="545" height="216" rx="14" fill="#091824" stroke="#16384c" stroke-width="1.2"/>
    <!-- Top accent bar -->
    <rect x="0" y="0" width="4" height="216" rx="2" fill="#2dd4bf"/>
    
    <!-- Header / Domain -->
    <text class="ps-mono" x="24" y="32" fill="#2dd4bf" font-size="10.5" font-weight="700" letter-spacing="1.8">01 // FULL-STACK PLATFORM</text>
    <circle cx="510" cy="28" r="4" fill="#22c55e">
      <animate attributeName="opacity" values="1;0.4;1" dur="2s" repeatCount="indefinite"/>
    </circle>
    <text class="ps-mono" x="495" y="32" fill="#22c55e" font-size="10" font-weight="700" text-anchor="end">PRODUCTION READY</text>

    <!-- Title -->
    <text class="ps-serif" x="24" y="66" font-size="24" font-weight="300" fill="#f0f6fc">Project CodeDNA</text>
    
    <!-- Description -->
    <text class="ps-sans" x="24" y="96" fill="#8ca0b3" font-size="12.5">
      Dynamic developer identity platform &amp; portfolio synthesis engine.
    </text>
    <text class="ps-sans" x="24" y="116" fill="#8ca0b3" font-size="12.5">
      Engineered end-to-end with high-throughput REST APIs and scalable schemas.
    </text>

    <!-- Metrics Row -->
    <rect x="24" y="132" width="140" height="22" rx="4" fill="#0d2b2c" stroke="#14b8a6" stroke-width="0.8"/>
    <text class="ps-mono" x="32" y="147" fill="#5eead4" font-size="10.5" font-weight="600">⚡ Dynamic Portfolio</text>

    <rect x="174" y="132" width="125" height="22" rx="4" fill="#0e2338" stroke="#1d4ed8" stroke-width="0.8"/>
    <text class="ps-mono" x="182" y="147" fill="#93c5fd" font-size="10.5" font-weight="600">🛡️ End-to-End Auth</text>

    <!-- Tech Chips Bottom Row -->
    <g transform="translate(24, 172)">
      <rect width="68" height="24" rx="6" fill="#1e293b"/>
      <text class="ps-mono" x="34" y="16" fill="#f59e0b" font-size="11" font-weight="700" text-anchor="middle">Java</text>

      <rect x="76" width="105" height="24" rx="6" fill="#1e293b"/>
      <text class="ps-mono" x="128" y="16" fill="#86efac" font-size="11" font-weight="700" text-anchor="middle">Spring Boot</text>

      <rect x="189" width="75" height="24" rx="6" fill="#1e293b"/>
      <text class="ps-mono" x="226" y="16" fill="#38bdf8" font-size="11" font-weight="700" text-anchor="middle">MySQL</text>

      <rect x="272" width="68" height="24" rx="6" fill="#1e293b"/>
      <text class="ps-mono" x="306" y="16" fill="#67e8f9" font-size="11" font-weight="700" text-anchor="middle">React</text>
    </g>
  </g>

  <!-- ================= CARD 2: ENTERPRISE JDBC CRUD ================= -->
  <g class="ps-card" transform="translate(615, 36)">
    <rect width="545" height="216" rx="14" fill="#091824" stroke="#16384c" stroke-width="1.2"/>
    <rect x="0" y="0" width="4" height="216" rx="2" fill="#38bdf8"/>
    
    <!-- Header / Domain -->
    <text class="ps-mono" x="24" y="32" fill="#38bdf8" font-size="10.5" font-weight="700" letter-spacing="1.8">02 // DATABASE ARCHITECTURE</text>
    <circle cx="510" cy="28" r="4" fill="#38bdf8"/>
    <text class="ps-mono" x="495" y="32" fill="#38bdf8" font-size="10" font-weight="700" text-anchor="end">TRANSACTIONAL</text>

    <!-- Title -->
    <text class="ps-serif" x="24" y="66" font-size="24" font-weight="300" fill="#f0f6fc">JDBC Enterprise Engine</text>
    
    <!-- Description -->
    <text class="ps-sans" x="24" y="96" fill="#8ca0b3" font-size="12.5">
      Zero-ORM, native database connectivity and transactional CRUD built from scratch.
    </text>
    <text class="ps-sans" x="24" y="116" fill="#8ca0b3" font-size="12.5">
      Optimized connection pooling, prepared statements &amp; complete SQL sanitization.
    </text>

    <!-- Metrics Row -->
    <rect x="24" y="132" width="135" height="22" rx="4" fill="#0c2333" stroke="#0284c7" stroke-width="0.8"/>
    <text class="ps-mono" x="32" y="147" fill="#38bdf8" font-size="10.5" font-weight="600">💎 ACID Compliant</text>

    <rect x="169" y="132" width="150" height="22" rx="4" fill="#0e2a27" stroke="#059669" stroke-width="0.8"/>
    <text class="ps-mono" x="177" y="147" fill="#6ee7b7" font-size="10.5" font-weight="600">⚡ Connection Pooling</text>

    <!-- Tech Chips Bottom Row -->
    <g transform="translate(24, 172)">
      <rect width="68" height="24" rx="6" fill="#1e293b"/>
      <text class="ps-mono" x="34" y="16" fill="#f59e0b" font-size="11" font-weight="700" text-anchor="middle">Java</text>

      <rect x="76" width="68" height="24" rx="6" fill="#1e293b"/>
      <text class="ps-mono" x="110" y="16" fill="#67e8f9" font-size="11" font-weight="700" text-anchor="middle">JDBC</text>

      <rect x="152" width="75" height="24" rx="6" fill="#1e293b"/>
      <text class="ps-mono" x="189" y="16" fill="#38bdf8" font-size="11" font-weight="700" text-anchor="middle">MySQL</text>

      <rect x="235" width="115" height="24" rx="6" fill="#1e293b"/>
      <text class="ps-mono" x="292" y="16" fill="#f43f5e" font-size="11" font-weight="700" text-anchor="middle">SQL Prepared</text>
    </g>
  </g>

  <!-- ================= CARD 3: HIBERNATE & JPA ================= -->
  <g class="ps-card" transform="translate(40, 268)">
    <rect width="545" height="216" rx="14" fill="#091824" stroke="#16384c" stroke-width="1.2"/>
    <rect x="0" y="0" width="4" height="216" rx="2" fill="#818cf8"/>
    
    <!-- Header / Domain -->
    <text class="ps-mono" x="24" y="32" fill="#818cf8" font-size="10.5" font-weight="700" letter-spacing="1.8">03 // ORM FRAMEWORKS</text>
    <circle cx="510" cy="28" r="4" fill="#818cf8"/>
    <text class="ps-mono" x="495" y="32" fill="#818cf8" font-size="10" font-weight="700" text-anchor="end">RELATIONAL MAPPER</text>

    <!-- Title -->
    <text class="ps-serif" x="24" y="66" font-size="24" font-weight="300" fill="#f0f6fc">Hibernate &amp; JPA Suite</text>
    
    <!-- Description -->
    <text class="ps-sans" x="24" y="96" fill="#8ca0b3" font-size="12.5">
      Multi-tier enterprise object-relational mapping patterns and schema cascades.
    </text>
    <text class="ps-sans" x="24" y="116" fill="#8ca0b3" font-size="12.5">
      Full 1:1, 1:N, N:1, and M:N relationship mappings with lazy/eager optimization.
    </text>

    <!-- Metrics Row -->
    <rect x="24" y="132" width="145" height="22" rx="4" fill="#1c1938" stroke="#6366f1" stroke-width="0.8"/>
    <text class="ps-mono" x="32" y="147" fill="#a5b4fc" font-size="10.5" font-weight="600">🔗 Cascade Mappings</text>

    <rect x="179" y="132" width="135" height="22" rx="4" fill="#1b2438" stroke="#3b82f6" stroke-width="0.8"/>
    <text class="ps-mono" x="187" y="147" fill="#bfdbfe" font-size="10.5" font-weight="600">⚡ Lazy Fetch Pattern</text>

    <!-- Tech Chips Bottom Row -->
    <g transform="translate(24, 172)">
      <rect width="68" height="24" rx="6" fill="#1e293b"/>
      <text class="ps-mono" x="34" y="16" fill="#f59e0b" font-size="11" font-weight="700" text-anchor="middle">Java</text>

      <rect x="76" width="95" height="24" rx="6" fill="#1e293b"/>
      <text class="ps-mono" x="123" y="16" fill="#cbd5e1" font-size="11" font-weight="700" text-anchor="middle">Hibernate</text>

      <rect x="179" width="60" height="24" rx="6" fill="#1e293b"/>
      <text class="ps-mono" x="209" y="16" fill="#86efac" font-size="11" font-weight="700" text-anchor="middle">JPA</text>

      <rect x="247" width="105" height="24" rx="6" fill="#1e293b"/>
      <text class="ps-mono" x="299" y="16" fill="#818cf8" font-size="11" font-weight="700" text-anchor="middle">Entity Lifecycles</text>
    </g>
  </g>

  <!-- ================= CARD 4: DSA PROBLEM-SOLVING HUB ================= -->
  <g class="ps-card" transform="translate(615, 268)">
    <rect width="545" height="216" rx="14" fill="#091824" stroke="#16384c" stroke-width="1.2"/>
    <rect x="0" y="0" width="4" height="216" rx="2" fill="#f59e0b"/>
    
    <!-- Header / Domain -->
    <text class="ps-mono" x="24" y="32" fill="#f59e0b" font-size="10.5" font-weight="700" letter-spacing="1.8">04 // ALGORITHMIC CORE</text>
    <circle cx="510" cy="28" r="4" fill="#f97316">
      <animate attributeName="opacity" values="1;0.4;1" dur="1.8s" repeatCount="indefinite"/>
    </circle>
    <text class="ps-mono" x="495" y="32" fill="#f97316" font-size="10" font-weight="700" text-anchor="end">300D+ STREAK 🔥</text>

    <!-- Title -->
    <text class="ps-serif" x="24" y="66" font-size="24" font-weight="300" fill="#f0f6fc">DSA Problem-Solving Hub</text>
    
    <!-- Description -->
    <text class="ps-sans" x="24" y="96" fill="#8ca0b3" font-size="12.5">
      Curated competitive programming archive: LeetCode, CodeChef, CF, GFG.
    </text>
    <text class="ps-sans" x="24" y="116" fill="#8ca0b3" font-size="12.5">
      Asymptotic optimization across Graph Theory, Dynamic Programming &amp; Trees.
    </text>

    <!-- Metrics Row -->
    <rect x="24" y="132" width="145" height="22" rx="4" fill="#2d1c0a" stroke="#d97706" stroke-width="0.8"/>
    <text class="ps-mono" x="32" y="147" fill="#fbbf24" font-size="10.5" font-weight="600">🏆 800+ Solved</text>

    <rect x="179" y="132" width="135" height="22" rx="4" fill="#1b1c38" stroke="#4f46e5" stroke-width="0.8"/>
    <text class="ps-mono" x="187" y="147" fill="#c7d2fe" font-size="10.5" font-weight="600">🎯 ICPC '26 Prelim</text>

    <!-- Tech Chips Bottom Row -->
    <g transform="translate(24, 172)">
      <rect width="68" height="24" rx="6" fill="#1e293b"/>
      <text class="ps-mono" x="34" y="16" fill="#38bdf8" font-size="11" font-weight="700" text-anchor="middle">C++</text>

      <rect x="76" width="68" height="24" rx="6" fill="#1e293b"/>
      <text class="ps-mono" x="110" y="16" fill="#f59e0b" font-size="11" font-weight="700" text-anchor="middle">Java</text>

      <rect x="152" width="75" height="24" rx="6" fill="#1e293b"/>
      <text class="ps-mono" x="189" y="16" fill="#60a5fa" font-size="11" font-weight="700" text-anchor="middle">Python</text>

      <rect x="235" width="125" height="24" rx="6" fill="#1e293b"/>
      <text class="ps-mono" x="297" y="16" fill="#2dd4bf" font-size="11" font-weight="700" text-anchor="middle">Algorithms &amp; DP</text>
    </g>
  </g>
</svg>