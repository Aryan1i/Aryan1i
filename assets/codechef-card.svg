<svg width="460" height="215" viewBox="0 0 460 215" xmlns="http://www.w3.org/2000/svg">
<defs>
  <linearGradient id="bgGrad" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0%" stop-color="#0d1117"/>
    <stop offset="100%" stop-color="#161b22"/>
  </linearGradient>

  <linearGradient id="badgeGrad" x1="0" y1="0" x2="1" y2="0">
    <stop offset="0%" stop-color="#5B4638"/>
    <stop offset="100%" stop-color="#7a5d4b"/>
  </linearGradient>

  <filter id="cardGlow" x="-20%" y="-20%" width="140%" height="140%">
    <feGaussianBlur stdDeviation="3" result="blur"/>
    <feMerge>
      <feMergeNode in="blur"/>
      <feMergeNode in="SourceGraphic"/>
    </feMerge>
  </filter>
</defs>

<!-- Card Base -->
<rect x="1" y="1" width="458" height="213" rx="16" fill="url(#bgGrad)" stroke="#2dd4bf" stroke-width="1.2"/>

<!-- Top Header Bar -->
<g transform="translate(24, 22)">
  <!-- CodeChef Chef Hat Icon -->
  <path d="M 0 20 C 0 10, 6 2, 16 2 C 20 2, 24 5, 26 8 C 28 4, 34 0, 42 0 C 50 0, 56 5, 58 11 C 61 7, 67 4, 73 5 C 82 7, 88 15, 87 24 C 84 27, 80 28, 76 28 L 10 28 C 4 28, 0 25, 0 20 Z" 
        fill="#a77a56" transform="scale(0.8) translate(0, 0)"/>
  <rect x="6" y="22" width="58" height="6" rx="2" fill="#d4a373"/>
  
  <!-- Platform Name -->
  <text x="75" y="20" fill="#ffffff" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="20" font-weight="700">CodeChef</text>
  <text x="75" y="34" fill="#64748b" font-family="'JetBrains Mono', monospace" font-size="11.5">@aryan_1ii</text>
  
  <!-- Division Badge -->
  <rect x="330" y="4" width="80" height="26" rx="13" fill="#1f2937" stroke="#374151" stroke-width="1"/>
  <text x="370" y="21" fill="#f59e0b" font-family="'JetBrains Mono', monospace" font-size="11.5" font-weight="700" text-anchor="middle">DIV 4</text>
</g>

<!-- Divider Line -->
<line x1="24" y1="72" x2="436" y2="72" stroke="#21262d" stroke-width="1"/>

<!-- Stats Section -->
<g transform="translate(24, 88)">
  <!-- Rating Column -->
  <g transform="translate(0, 0)">
    <text x="0" y="14" fill="#8b949e" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="11" font-weight="600" letter-spacing="1">CURRENT RATING</text>
    <text x="0" y="52" fill="#2dd4bf" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="38" font-weight="800">1268</text>
    
    <!-- Stars Display -->
    <g transform="translate(0, 68)">
      <text x="0" y="12" fill="#fbbf24" font-size="16">★</text>
      <text x="18" y="12" fill="#6b7280" font-size="16">★★★★</text>
      <text x="72" y="11" fill="#8b949e" font-family="'JetBrains Mono', monospace" font-size="11">(1 Star Coder)</text>
    </g>
  </g>

  <!-- Metrics Column 2 -->
  <g transform="translate(210, 0)">
    <!-- Peak Rating Box -->
    <rect x="0" y="0" width="200" height="42" rx="8" fill="#161b22" stroke="#30363d" stroke-width="0.8"/>
    <text x="14" y="18" fill="#8b949e" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="10" font-weight="600">PEAK CONTEST RATING</text>
    <text x="14" y="34" fill="#f59e0b" font-family="'JetBrains Mono', monospace" font-size="14" font-weight="700">1268</text>

    <!-- Global Activity Box -->
    <rect x="0" y="50" width="200" height="42" rx="8" fill="#161b22" stroke="#30363d" stroke-width="0.8"/>
    <text x="14" y="68" fill="#8b949e" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="10" font-weight="600">PRACTICE &amp; CONTESTS</text>
    <text x="14" y="84" fill="#58a6ff" font-family="'JetBrains Mono', monospace" font-size="13" font-weight="600">Active Competitor</text>
  </g>
</g>

<!-- Footer subtle accent -->
<rect x="1" y="211" width="458" height="3" fill="#2dd4bf" opacity="0.6" rx="1.5"/>

</svg>
