<svg width="460" height="215" viewBox="0 0 460 215" xmlns="http://www.w3.org/2000/svg">
<defs>
  <linearGradient id="bgGrad" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0%" stop-color="#0d1117"/>
    <stop offset="100%" stop-color="#161b22"/>
  </linearGradient>

  <filter id="cardGlow" x="-20%" y="-20%" width="140%" height="140%">
    <feGaussianBlur stdDeviation="3" result="blur"/>
    <feMerge>
      <feMergeNode in="blur"/>
      <feMergeNode in="SourceGraphic"/>
    </feMerge>
  </filter>
  <linearGradient id="ccRay" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0%" stop-color="#ffffff"/>
    <stop offset="35%" stop-color="#5eead4"/>
    <stop offset="70%" stop-color="#2dd4bf"/>
    <stop offset="100%" stop-color="#0f766e" stop-opacity="0"/>
  </linearGradient>
</defs>

<!-- Card Base with rounded border -->
<rect x="1" y="1" width="458" height="213" rx="16" fill="url(#bgGrad)" stroke="#1a2e3d" stroke-width="1.2"/>
<!-- Animated Moving Ray on Border -->
<rect x="1" y="1" width="458" height="213" rx="16" fill="none" 
      stroke="url(#ccRay)" stroke-width="2" stroke-linecap="round"
      stroke-dasharray="240 1110">
  <animate attributeName="stroke-dashoffset" values="1350;0" dur="4.8s" repeatCount="indefinite"/>
</rect>

<!-- Top Header Bar -->
<g transform="translate(24, 20)">
  <!-- Official CodeChef Brand Logo -->
  <g transform="translate(0, 2) scale(1.4)" fill="#d4a373">
    <path d="M11.2574.0039c-.37.0101-.7353.041-1.1003.095C9.6164.153 9.0766.4236 8.482.694c-.757.3244-1.5147.6486-2.2176.7027-1.1896.3785-1.568.919-1.8925 1.3516 0 .054-.054.1079-.054.1079-.4325.865-.4873 1.73-.325 2.5952.1621.5407.3786 1.0282.5408 1.5148.3785 1.0274.7578 2.0007.92 3.1362.1622.3244.3235.7571.4316 1.1897.2704.8651.542 1.8383 1.353 2.5952l.0057-.0028c.0175.0183.0301.0387.0482.0568.0072-.0036.0141-.0063.0213-.0099l-.0213-.5849c.6489-.9733 1.5673-1.6221 2.865-1.8925.5195-.1093 1.081-.1497 1.6625-.1278a8.7733 8.7733 0 0 1 1.7988.2357c1.4599.3785 2.595 1.1358 2.6492 1.7846.0273.3549.0398.6952.0326 1.0364-.001.064-.0046.1285-.007.193l.1362.0682c.075-.0375.1424-.107.2059-.1902.0008-.001.002-.002.0028-.0028.0018-.0023.0039-.0061.0057-.0085.0396-.0536.0747-.1236.1107-.1931.0188-.0377.0372-.0866.0554-.1292.2048-.4622.362-1.1536.538-1.9635.0541-.2703.1092-.4864.1633-.7027.4326-.9733 1.0266-1.8382 1.6213-2.6492.9733-1.3518 1.8928-2.5962 1.7846-4.0561-1.784-3.4608-4.2718-4.0017-5.5695-4.272-.2163-.0541-.3233-.0539-.4856-.108-1.3382-.2433-2.4945-.3953-3.6046-.3648z"/>
  </g>
  
  <!-- Platform Name & Username -->
  <text x="46" y="19" fill="#ffffff" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="19" font-weight="700">CodeChef</text>
  <text x="46" y="34" fill="#8b949e" font-family="'JetBrains Mono', monospace" font-size="12">@aryan_1ii</text>
  
  <!-- Division Badge -->
  <rect x="330" y="4" width="82" height="26" rx="13" fill="#1f2937" stroke="#374151" stroke-width="1"/>
  <text x="371" y="21" fill="#f59e0b" font-family="'JetBrains Mono', monospace" font-size="11.5" font-weight="700" text-anchor="middle">DIV 4</text>
</g>

<!-- Divider Line -->
<line x1="24" y1="72" x2="436" y2="72" stroke="#21262d" stroke-width="1"/>

<!-- Stats Section -->
<g transform="translate(24, 88)">
  <!-- Rating Column -->
  <g transform="translate(0, 0)">
    <text x="0" y="14" fill="#8b949e" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="11" font-weight="600" letter-spacing="1">CURRENT RATING</text>
    <text x="0" y="54" fill="#2dd4bf" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="38" font-weight="800">1268</text>
    
    <!-- Stars Display with proper spacing -->
    <g transform="translate(0, 72)">
      <text x="0" y="12" fill="#fbbf24" font-size="16">★</text>
      <text x="18" y="12" fill="#4b5563" font-size="16">★★★★</text>
      <text x="96" y="12" fill="#8b949e" font-family="'JetBrains Mono', monospace" font-size="11.5">(1★ Coder)</text>
    </g>
  </g>

  <!-- Metrics Column 2 -->
  <g transform="translate(210, 0)">
    <!-- Peak Rating Box -->
    <rect x="0" y="0" width="200" height="44" rx="8" fill="#161b22" stroke="#30363d" stroke-width="0.8"/>
    <text x="14" y="18" fill="#8b949e" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="10" font-weight="600" letter-spacing="0.5">PEAK CONTEST RATING</text>
    <text x="14" y="36" fill="#f59e0b" font-family="'JetBrains Mono', monospace" font-size="15" font-weight="700">1268</text>

    <!-- Activity Box -->
    <rect x="0" y="52" width="200" height="44" rx="8" fill="#161b22" stroke="#30363d" stroke-width="0.8"/>
    <text x="14" y="70" fill="#8b949e" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="10" font-weight="600" letter-spacing="0.5">PRACTICE &amp; CONTESTS</text>
    <text x="14" y="88" fill="#58a6ff" font-family="'JetBrains Mono', monospace" font-size="13" font-weight="600">Active Competitor</text>
  </g>
</g>

<!-- Footer subtle accent -->
<rect x="1" y="211" width="458" height="3" fill="#2dd4bf" opacity="0.6" rx="1.5"/>

</svg>
